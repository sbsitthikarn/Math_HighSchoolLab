<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math High School Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Bai+Jamjuree:wght@500;600;700&display=swap">
<style>
/* Layout: graph-paper ground; header with language switch; grade filter chips; app cards in an auto-fill grid */
:root{
  --paper:#EEF3F2; --surface:#FFFFFF; --ink:#18222E; --muted:#5A6873; --line:#D3DDDB; --grid-minor:#E2EBE9;
  --accent:#2B4C9B; --accent-ink:#FFFFFF; --accent-soft:#E7EDF9; --curve:#B0263F;
  --f-display:"Bai Jamjuree","Anuphan",system-ui,sans-serif; --f-body:"Anuphan","Bai Jamjuree",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#0F151A; --surface:#161F27; --ink:#E2E9EE; --muted:#93A2AE; --line:#2A3641; --grid-minor:#1B252E;
  --accent:#93AEFF; --accent-ink:#0E1520; --accent-soft:#1D2944; --curve:#FF6F86; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  background-image:linear-gradient(var(--grid-minor) 1px,transparent 1px),linear-gradient(90deg,var(--grid-minor) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:8px}
.eyebrow{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--f-display);font-size:clamp(1.8rem,4.5vw,2.6rem);line-height:1.15;margin:2px 0 0;text-wrap:balance}
h1 span{color:var(--curve)}
.lead{color:var(--muted);max-width:62ch;margin:10px 0 22px}
.lang{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.lang button,.chips button{font:inherit;font-weight:600;font-size:.9rem;border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:7px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.chips button{border:1px solid var(--line);background:var(--surface)}
.chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:10px;align-content:start}
.card svg{display:block}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
.card h2{font-family:var(--f-display);font-size:1.2rem;line-height:1.3;margin:0}
.card p{margin:0;color:var(--muted);font-size:.93rem}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.btn{font-weight:600;font-size:.92rem;text-decoration:none;border-radius:8px;padding:8px 14px;border:1.5px solid var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{color:var(--accent)}
.empty{color:var(--muted);font-size:.95rem;padding:20px;border:1.5px dashed var(--line);border-radius:12px;text-align:center}
footer{margin-top:28px;font-size:.82rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" data-t="eyebrow"></div>
      <h1>Math High School <span>Lab</span></h1>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="th" aria-pressed="true">ไทย</button>
      <button data-lang="en" aria-pressed="false">English</button>
    </div>
  </header>
  <p class="lead" data-t="lead"></p>
  <div class="chips" id="chips" role="group"></div>
  <div class="grid" id="grid"></div>
  <footer data-t="foot"></footer>
</div>
<script>
/* ===== รายการแอป: เพิ่มแอปใหม่โดยเพิ่ม object ในอาร์เรย์นี้ ===== */
const APPS=[
  {folder:'quadratic',grade:3,icon:'parabola',
   th:{title:'Parabola Lab: กราฟของฟังก์ชันกำลังสอง',desc:'สำรวจกราฟแบบปรับค่าได้ พิมพ์สมการเองได้ ฝึกโจทย์ 8 ระดับตั้งแต่พื้นฐานถึงโจทย์แนวแบบฝึกหัดในหนังสือ พร้อมเฉลยวิธีทำ',topic:'ฟังก์ชันกำลังสอง'},
   en:{title:'Parabola Lab: Graphs of Quadratic Functions',desc:'Explore graphs with sliders, type your own equation, and practise 8 levels from the basics to textbook-style questions with worked solutions.',topic:'Quadratic functions'},
   pages:{th:'quadratic/',en:'quadratic/en.html'}}
];
const TXT={
  th:{eyebrow:'แอปฝึกคณิตศาสตร์ระดับมัธยม',lead:'รวมแอปสำหรับสำรวจแนวคิดและฝึกโจทย์คณิตศาสตร์ เปิดได้ทั้งบนคอมพิวเตอร์ แท็บเล็ต และโทรศัพท์ โดยไม่ต้องติดตั้งหรือล็อกอิน',all:'ทั้งหมด',grade:g=>'ม.'+g,open:'เปิดแอป',other:'English',empty:'ยังไม่มีแอปสำหรับระดับชั้นนี้',foot:'ผลการฝึกบันทึกไว้ในเครื่องของผู้ใช้แต่ละคน'},
  en:{eyebrow:'Secondary school maths practice apps',lead:'Apps for exploring ideas and practising maths. They work on computers, tablets and phones, with nothing to install and no sign-in.',all:'All',grade:g=>'Grade '+(g+6),open:'Open app',other:'ภาษาไทย',empty:'No apps for this grade yet.',foot:'Practice progress is saved on each person’s own device.'}
};
const ICON={parabola:'<svg width="56" height="44" viewBox="0 0 52 44" aria-hidden="true"><path d="M2 40H50M26 2V42" stroke="var(--muted)" stroke-width="1.6" fill="none"/><path d="M6 6 Q26 70 46 6" stroke="var(--curve)" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="26" cy="38" r="3.4" fill="var(--surface)" stroke="var(--curve)" stroke-width="2"/></svg>'};
let lang='th',grade=0;
try{const s=localStorage.getItem('mhl-lang');if(s==='en'||s==='th')lang=s;else if(!navigator.language.startsWith('th'))lang='en';}catch(e){}
function render(){const t=TXT[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=t[el.dataset.t];});
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
  const grades=[...new Set(APPS.map(a=>a.grade))].sort();
  document.getElementById('chips').innerHTML=[0,...grades].map(g=>`<button data-g="${g}" aria-pressed="${g===grade}">${g?t.grade(g):t.all}</button>`).join('');
  document.querySelectorAll('#chips button').forEach(b=>b.addEventListener('click',()=>{grade=Number(b.dataset.g);render();}));
  const list=APPS.filter(a=>!grade||a.grade===grade);
  document.getElementById('grid').innerHTML=list.length?list.map(a=>{const x=a[lang],other=lang==='th'?'en':'th';
    return `<article class="card">${ICON[a.icon]||''}<div class="meta"><span class="tag">${t.grade(a.grade)}</span><span class="tag">${x.topic}</span></div><h2>${x.title}</h2><p>${x.desc}</p><div class="links"><a class="btn primary" href="${a.pages[lang]}">${t.open}</a>${a.pages[other]?`<a class="btn ghost" href="${a.pages[other]}">${t.other}</a>`:''}</div></article>`;}).join(''):`<div class="empty">${t.empty}</div>`;}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;try{localStorage.setItem('mhl-lang',lang);}catch(e){}render();}));
render();
</script>
</body>
</html>
